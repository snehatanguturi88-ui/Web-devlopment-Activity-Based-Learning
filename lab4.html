<!DOCTYPE html>
<html>
<head>
    <title>Seat Selection</title>
    <link rel="stylesheet" href="lab.css">
</head>
<body>

<header>
    <h1>Select Your Seat</h1>
    <nav>
        <a href="lab1.html">Home</a>
        <a href="lab3.html">Services</a>
    </nav>
</header>

<div class="container">
    <h2>Available Seats</h2>

    <div class="seat-layout">

        <div class="seat">
            <input type="checkbox" id="s1">
            <label for="s1">1</label>
        </div>

        <div class="seat">
            <input type="checkbox" id="s2">
            <label for="s2">2</label>
        </div>

        <div class="seat">
            <input type="checkbox" id="s3">
            <label for="s3">3</label>
        </div>

        <div class="seat">
            <input type="checkbox" id="s4">
            <label for="s4">4</label>
        </div>

        <div class="seat">
            <input type="checkbox" id="s5">
            <label for="s5">5</label>
        </div>

        <div class="seat">
            <input type="checkbox" id="s6">
            <label for="s6">6</label>
        </div>

    </div>

    <p>Green = Available | Selected = Blue</p>

    <h3>Fare Details</h3>
    <p>Ticket Fare: ₹500</p>
    <p>Booking Charge: ₹20</p>
    <h3>Total: ₹520</h3>

    <button onclick="alert('Booking Submitted Successfully!')">
        Confirm Booking
    </button>

</div>

</body>
</html>
